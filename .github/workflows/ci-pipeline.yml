name: Simple CI Pipeline
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run a basic test
        run: echo "CI Pipeline Running!"

      - name: Run tests
        run: bash test_script.sh

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # NYT: Installér pytest og andre pakker
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Hvis du har andre pakker: pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest test_example.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore
        run: dotnet restore DevOpsExercises.sln

      - name: Build
        run: dotnet build DevOpsExercises.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DevOpsExercises.sln --no-build --configuration Release